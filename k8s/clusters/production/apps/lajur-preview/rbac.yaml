# Identity the preview ResourceSet applies with, scoped to this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: flux
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-cnpg-databases
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-cnpg-databases
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-cnpg-databases
subjects:
  - kind: ServiceAccount
    name: flux

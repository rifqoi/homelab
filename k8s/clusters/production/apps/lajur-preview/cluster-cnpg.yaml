# Shared by all previews; each PR gets its own database via a CNPG Database.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lajur-preview-pg
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: zfs-iscsi-retain
  bootstrap:
    initdb:
      database: lajur
      owner: lajur
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

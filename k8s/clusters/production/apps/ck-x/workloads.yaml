apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckx-redis
  labels:
    app.kubernetes.io/name: ckx-redis
    app.kubernetes.io/part-of: ck-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckx-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckx-redis
        app.kubernetes.io/part-of: ck-x
    spec:
      # No Docker-link style *_SERVICE_*/*_PORT env vars: CK-X reads
      # REMOTE_DESKTOP_PORT etc. as plain ports (compose defaults), and the
      # injected tcp://IP:port values broke the facilitator's URLs.
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckx-facilitator
  labels:
    app.kubernetes.io/name: ckx-facilitator
    app.kubernetes.io/part-of: ck-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckx-facilitator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckx-facilitator
        app.kubernetes.io/part-of: ck-x
    spec:
      # No Docker-link style *_SERVICE_*/*_PORT env vars: CK-X reads
      # REMOTE_DESKTOP_PORT etc. as plain ports (compose defaults), and the
      # injected tcp://IP:port values broke the facilitator's URLs.
      enableServiceLinks: false
      containers:
        - name: facilitator
          image: nishanb/ck-x-simulator-facilitator:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: prod
            - name: SSH_HOST
              value: jumphost
            - name: SSH_PORT
              value: "22"
            - name: SSH_USERNAME
              value: candidate
            - name: LOG_LEVEL
              value: info
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: TRACK_METRICS
              value: "true"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
---

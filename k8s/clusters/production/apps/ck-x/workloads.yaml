apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckx-remote-desktop
  labels:
    app.kubernetes.io/name: ckx-remote-desktop
    app.kubernetes.io/part-of: ck-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckx-remote-desktop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckx-remote-desktop
        app.kubernetes.io/part-of: ck-x
    spec:
      # No Docker-link style *_SERVICE_*/*_PORT env vars: CK-X reads
      # REMOTE_DESKTOP_PORT etc. as plain ports (compose defaults), and the
      # injected tcp://IP:port values broke the facilitator's URLs.
      enableServiceLinks: false
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      containers:
        - name: remote-desktop
          image: nishanb/ck-x-simulator-remote-desktop:latest
          imagePullPolicy: Always
          ports:
            - name: vnc
              containerPort: 5901
            - name: web-vnc
              containerPort: 6901
            # agent.py: the facilitator calls /restart-vnc-session here when
            # an exam starts.
            - name: agent
              containerPort: 5000
          env:
            - name: VNC_PW
              value: bakku-the-wizard
            - name: VNC_PASSWORD
              value: bakku-the-wizard
            - name: VNC_VIEW_ONLY
              value: "false"
            - name: VNC_RESOLUTION
              value: 1280x800
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /
              port: web-vnc
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckx-webapp
  labels:
    app.kubernetes.io/name: ckx-webapp
    app.kubernetes.io/part-of: ck-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ckx-webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ckx-webapp
        app.kubernetes.io/part-of: ck-x
    spec:
      # No Docker-link style *_SERVICE_*/*_PORT env vars: CK-X reads
      # REMOTE_DESKTOP_PORT etc. as plain ports (compose defaults), and the
      # injected tcp://IP:port values broke the facilitator's URLs.
      enableServiceLinks: false
      containers:
        - name: webapp
          image: nishanb/ck-x-simulator-webapp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: VNC_SERVICE_HOST
              value: remote-desktop
            - name: VNC_SERVICE_PORT
              value: "6901"
            - name: VNC_PASSWORD
              value: bakku-the-wizard
            - name: SSH_HOST
              value: remote-terminal
            - name: SSH_PORT
              value: "22"
            - name: SSH_USER
              value: candidate
            - name: SSH_PASSWORD
              value: password
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
---

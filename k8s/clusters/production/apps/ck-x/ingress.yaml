apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ckx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: ckx.rifqoi.com
    ingress.cilium.io/force-https: "true"
    ingress.cilium.io/tls-passthrough: "false"
spec:
  ingressClassName: cilium
  rules:
    - host: ckx.rifqoi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
  tls:
    - secretName: rifqoi-com-tls
      hosts:
        - ckx.rifqoi.com

# Migrated from Ingress to the shared kgateway (192.168.31.139).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ckx-app
  namespace: ck-x
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ckx.rifqoi.com
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - ckx.rifqoi.com
  rules:
    - backendRefs:
        - name: nginx
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ckx-redirect
  namespace: ck-x
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - ckx.rifqoi.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-ui
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: garage-ui
  chartRef:
    kind: OCIRepository
    name: garage-ui
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    fullnameOverride: garage-ui
    config:
      server:
        domain: garage.rifqoi.com
        protocol: https
        root_url: https://garage.rifqoi.com
      garage:
        endpoint: http://192.168.31.10:3900
        admin_endpoint: http://192.168.31.10:3903
        region: garage
        existingSecret:
          name: garage-admin-token
          key: admin-token
    ingress:
      enabled: true
      className: cilium
      annotations:
        external-dns.alpha.kubernetes.io/hostname: garage.rifqoi.com
      hosts:
        - host: garage.rifqoi.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: rifqoi-com-tls
          hosts:
            - garage.rifqoi.com

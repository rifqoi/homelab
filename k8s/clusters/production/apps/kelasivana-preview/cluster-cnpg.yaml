apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kelasivana-preview-pg
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: zfs-iscsi-retain
  bootstrap:
    initdb:
      database: kelasivana
      owner: kelasivana
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  imageName: ghcr.io/cloudnative-pg/postgresql:17

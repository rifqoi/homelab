# Solves Cloudflare JS challenges for unosystem.net (anti-bot added Nov 2026).
# Cluster-internal only — no route/ingress. Called by the n8n workflow via a
# per-execution session so cf cookies/UA stay consistent across requests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:latest
          ports:
            - name: http
              containerPort: 8191
          env:
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # All 4 schedules fire within the same minute -> 4 concurrent
              # Chromium sessions. 2Gi OOMKilled the pod mid-run (2026-11-09).
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        # Chrome crashes under the default 64Mi shm. Memory-backed shm counts
        # toward the container limit, so keep it well under 4Gi.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: n8n
spec:
  selector:
    app: flaresolverr
  ports:
    - name: http
      port: 8191
      targetPort: 8191

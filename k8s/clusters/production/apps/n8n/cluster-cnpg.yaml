apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-pg
  namespace: n8n
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.9
  # ── Storage ────────────────────────────────────────────────────
  storage:
    size: 10Gi
    storageClass: zfs-iscsi-retain
  # ── Bootstrap ──────────────────────────────────────────────────
  # Creates the initial database and user for n8n
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-pg-user
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  # ── PostgreSQL config ──────────────────────────────────────────
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "16MB"
      maintenance_work_mem: "64MB"
      max_connections: "100"
      wal_level: "replica"
      max_wal_size: "1GB"
      min_wal_size: "80MB"
    pg_hba:
      - host n8n n8n all md5
  # ── Superuser ──────────────────────────────────────────────────
  enableSuperuserAccess: false
  # ── Resources ──────────────────────────────────────────────────
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  # ── Monitoring ─────────────────────────────────────────────────
  monitoring:
    enablePodMonitor: false # set true if Prometheus operator installed

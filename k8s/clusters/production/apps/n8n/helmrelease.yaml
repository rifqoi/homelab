apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: n8n
  dependsOn:
    - name: cloudnative-pg
  chartRef:
    kind: OCIRepository
    name: n8n
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    # Name all rendered resources "n8n" instead of "n8n-n8n"
    fullnameOverride: n8n
    # ── Ingress (external-dns -> OpenWRT) ──────────────────────────
    ingress:
      enabled: true
      className: cilium
      annotations:
        external-dns.alpha.kubernetes.io/hostname: n8n.rifqoi.com
        # Pin the cilium ingress LB IP. The OpenWRT external-dns webhook
        # provider has no TXT registry, so external-dns (policy: upsert-only)
        # can CREATE a record but never UPDATE it. It first published
        # n8n.rifqoi.com -> .132; pinning the LB IP here keeps the ingress on
        # that address so it never drifts from the published record.
        lbipam.cilium.io/ips: "192.168.31.132"
      hosts:
        - host: n8n.rifqoi.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: rifqoi-com-tls
          hosts:
            - n8n.rifqoi.com
    # ── Main n8n app ───────────────────────────────────────────────
    main:
      replicaCount: 1
      # config: {} -> flattened into a ConfigMap as env vars
      config:
        TZ: Asia/Jakarta # container system clock -> WIB
        db:
          type: postgresdb
          postgresdb:
            host: n8n-pg-rw
            port: 5432
            database: n8n
            user: n8n
        n8n:
          host: n8n.rifqoi.com
          # Explicitly define N8N_PORT so Kubernetes service-link injection
          # cannot replace it with the n8n Service's tcp://... value.
          port: 5678
          protocol: https
          editor_base_url: https://n8n.rifqoi.com
        webhook_url: https://n8n.rifqoi.com
        generic:
          timezone: Asia/Jakarta
      # extraEnv: reference secrets (DB password from CNPG-owned user
      # secret, encryption key from sops-managed secret)
      extraEnv:
        DB_POSTGRESDB_PASSWORD:
          valueFrom:
            secretKeyRef:
              name: n8n-pg-user
              key: password
        N8N_ENCRYPTION_KEY:
          valueFrom:
            secretKeyRef:
              name: n8n-secret
              key: N8N_ENCRYPTION_KEY
      # Persist /home/node/.n8n on the requested 20Gi PVC
      persistence:
        enabled: true
        type: existing
        existingClaim: n8n-data
      service:
        type: ClusterIP
        port: 80
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "1000m"
    # ── Workers / webhook (single-instance setup, disabled) ────────
    worker:
      enabled: false
    webhook:
      enabled: false
    # ── Valkey/Redis (only needed for queue mode) ──────────────────
    valkey:
      enabled: false

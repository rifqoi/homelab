apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: metamcp
  name: metamcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metamcp
  template:
    metadata:
      labels:
        app: metamcp
    spec:
      imagePullSecrets:
        - name: regcred-rifqoi-registry-com
      containers:
        - name: metamcp
          image: ghcr.io/metatool-ai/metamcp:latest
          ports:
            - name: http
              containerPort: 12008
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              value: nongkee-be-pg-rw.nongkee.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: nongkee
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: metamcp-pg-user
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metamcp-pg-user
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: APP_URL
              value: https://metamcp.rifqoi.com
            - name: NEXT_PUBLIC_APP_URL
              value: https://metamcp.rifqoi.com
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: metamcp-secret
                  key: better-auth-secret
            - name: TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL
              value: "false"
            - name: BOOTSTRAP_ENABLE
              value: "true"
            - name: BOOTSTRAP_ONLY_FIRST_RUN
              value: "true"
            - name: BOOTSTRAP_USER_EMAIL
              value: admin@rifqoi.com
            - name: BOOTSTRAP_USER_NAME
              value: Admin
            - name: BOOTSTRAP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metamcp-secret
                  key: bootstrap-user-password
            - name: BOOTSTRAP_API_KEYS
              value: '[{"name":"Public","is_public":true},{"name":"Private","is_public":false}]'
            - name: BOOTSTRAP_NAMESPACES
              value: '[{"name":"Default","description":"Default namespace","is_public":true,"update":true}]'
            - name: BOOTSTRAP_ENDPOINTS
              value: '[{"name":"Public","description":"Public endpoint","enable_auth":false,"enable_auth_query":false,"enable_auth_oauth":false,"is_public":true,"update":true}]'
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo
  namespace: omnigent
  labels:
    app.kubernetes.io/name: paseo
    app.kubernetes.io/component: daemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paseo
      app.kubernetes.io/component: daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paseo
        app.kubernetes.io/component: daemon
      annotations:
        paseo.rifqoi.com/config-revision: v1
    spec:
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: regcred-rifqoi-registry-com
      initContainers:
        - name: prepare-home
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /home/paseo/.paseo /home/paseo/.codex /home/paseo/.agents/skills /workspace
              chown -R 1000:1000 /home/paseo /workspace
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: workspace
              mountPath: /workspace
            - name: vpn-control
              mountPath: /run/paseo-vpn
        - name: sync-skills
          image: registry.rifqoi.com/paseo:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - |
              work=/tmp/paseo-skills
              sshdir=/tmp/paseo-skills-ssh
              rm -rf "$work" "$sshdir"
              install -d -m 0700 "$sshdir"
              cp /run/paseo-skills-git/identity "$sshdir/identity"
              cp /run/paseo-skills-git/known_hosts "$sshdir/known_hosts"
              chmod 0600 "$sshdir/identity"
              export GIT_SSH_COMMAND="ssh -i $sshdir/identity -o IdentitiesOnly=yes -o UserKnownHostsFile=$sshdir/known_hosts"
              GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch main ssh://git@github.com/rifqoi/paseo-skills "$work"
              test -d "$work/skills"
              rm -rf /home/paseo/.agents/skills
              mv "$work/skills" /home/paseo/.agents/skills
              install -m 0644 "$work/AGENTS.md" /home/paseo/AGENTS.md
              chown -R 1000:1000 /home/paseo/.agents /home/paseo/AGENTS.md
              rm -rf "$work" "$sshdir"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: skills-git
              mountPath: /run/paseo-skills-git
              readOnly: true
      containers:
        - name: paseo
          image: registry.rifqoi.com/paseo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 6767
              protocol: TCP
          env:
            - name: HOME
              value: /home/paseo
            - name: PASEO_HOME
              value: /home/paseo/.paseo
            - name: PASEO_LISTEN
              value: 0.0.0.0:6767
            - name: PASEO_WEB_UI_ENABLED
              value: "true"
            - name: PASEO_HOSTNAMES
              value: paseo.rifqoi.com
            - name: PASEO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paseo-secrets
                  key: PASEO_PASSWORD
          envFrom:
            - secretRef:
                name: paseo-env
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: workspace
              mountPath: /workspace
            - name: vpn-control
              mountPath: /run/paseo-vpn
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 8Gi
        - name: skills-sync
          image: registry.rifqoi.com/paseo:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - |
              sshdir=/tmp/paseo-skills-ssh
              install -d -m 0700 "$sshdir"
              cp /run/paseo-skills-git/identity "$sshdir/identity"
              cp /run/paseo-skills-git/known_hosts "$sshdir/known_hosts"
              chmod 0600 "$sshdir/identity"
              export GIT_SSH_COMMAND="ssh -i $sshdir/identity -o IdentitiesOnly=yes -o UserKnownHostsFile=$sshdir/known_hosts"
              while true; do
                revision=$(GIT_TERMINAL_PROMPT=0 git ls-remote ssh://git@github.com/rifqoi/paseo-skills refs/heads/main 2>/dev/null | awk '{print $1}') || revision=
                current=$(cat /home/paseo/.agents/.skills-revision 2>/dev/null || true)
                if test -n "$revision" && test "$revision" != "$current"; then
                  work="/tmp/paseo-skills-$revision"
                  rm -rf "$work"
                  if GIT_TERMINAL_PROMPT=0 git clone --depth 1 --branch main ssh://git@github.com/rifqoi/paseo-skills "$work"; then
                    test -d "$work/skills"
                    rm -rf /home/paseo/.agents/.skills-next
                    mv "$work/skills" /home/paseo/.agents/.skills-next
                    rm -rf /home/paseo/.agents/skills.previous
                    mv /home/paseo/.agents/skills /home/paseo/.agents/skills.previous
                    mv /home/paseo/.agents/.skills-next /home/paseo/.agents/skills
                    install -m 0644 "$work/AGENTS.md" /home/paseo/AGENTS.md
                    printf '%s\n' "$revision" > /home/paseo/.agents/.skills-revision
                    rm -rf /home/paseo/.agents/skills.previous "$work"
                  fi
                fi
                sleep 300
              done
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: home
              mountPath: /home/paseo
            - name: skills-git
              mountPath: /run/paseo-skills-git
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        - name: corp-vpn
          image: registry.rifqoi.com/paseo:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
          args:
            - exec /home/paseo/.agents/skills/vpn-connect/scripts/vpn-supervisor.sh
          env:
            - name: VPN_URL
              valueFrom:
                configMapKeyRef:
                  name: paseo-vpn-config
                  key: VPN_URL
            - name: VPN_GROUP
              valueFrom:
                configMapKeyRef:
                  name: paseo-vpn-config
                  key: VPN_GROUP
            - name: LDAP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: paseo-env
                  key: LDAP_USERNAME
            - name: LDAP_PW
              valueFrom:
                secretKeyRef:
                  name: paseo-env
                  key: LDAP_PW
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          volumeMounts:
            - name: home
              mountPath: /home/paseo
              readOnly: true
            - name: vpn-control
              mountPath: /run/paseo-vpn
            - name: vpn-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: omnigent-codex-host-home
        - name: workspace
          persistentVolumeClaim:
            claimName: omnigent-codex-host-home
        - name: skills-git
          secret:
            secretName: paseo-skills-git
            defaultMode: 0440
        - name: vpn-control
          emptyDir:
            medium: Memory
        - name: vpn-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice

# Migrated from Ingress to the shared kgateway (192.168.31.139).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo-app
  namespace: omnigent
  annotations:
    external-dns.alpha.kubernetes.io/hostname: paseo.rifqoi.com
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - paseo.rifqoi.com
  rules:
    - backendRefs:
        - name: paseo
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo-redirect
  namespace: omnigent
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - paseo.rifqoi.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paseo-skills-config
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: paseo-skills
  path: ./flux/paseo
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

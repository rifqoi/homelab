# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: paseo-agent-profiles
    files:
      - agent-profiles.json

resources:
  - namespace.yaml
  - paseo-secrets.enc.yaml
  - registry-secret.enc.yaml
  - paseo-skills-git-flux.enc.yaml
  - paseo-skills-git-pod.enc.yaml
  - paseo-skills-gitrepository.yaml
  - paseo-skills-config.yaml
  - home-pvc.yaml
  - legacy-artifacts-pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paseo
  namespace: omnigent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: paseo.rifqoi.com
    ingress.cilium.io/force-https: "true"
spec:
  ingressClassName: cilium
  tls:
    - secretName: paseo-rifqoi-com-tls
      hosts:
        - paseo.rifqoi.com
  rules:
    - host: paseo.rifqoi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paseo
                port:
                  name: http

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lajur-dev-pg
spec:
  instances: 1
  # A single instance cannot satisfy minAvailable: 1, so the primary PDB only
  # blocks node drains (e.g. Omni Talos upgrades) without adding availability.
  enablePDB: false
  storage:
    size: 2Gi
    storageClass: zfs-iscsi-retain
  # CNPG generates the lajur-dev-pg-app secret (uri, username, password).
  bootstrap:
    initdb:
      database: lajur
      owner: lajur
      dataChecksums: true
      encoding: UTF8
      localeCollate: C
      localeCType: C
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "300m"

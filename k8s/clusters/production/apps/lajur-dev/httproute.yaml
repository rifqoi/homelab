# Migrated from Ingress to the shared kgateway (192.168.31.139).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lajur-app
  namespace: lajur-dev
  annotations:
    external-dns.alpha.kubernetes.io/hostname: lajur-dev.rifqoi.com
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - lajur-dev.rifqoi.com
  rules:
    - backendRefs:
        - name: lajur
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lajur-redirect
  namespace: lajur-dev
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
      sectionName: http
  hostnames:
    - lajur-dev.rifqoi.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

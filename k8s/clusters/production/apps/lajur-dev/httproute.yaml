# POC route via the kgateway shared gateway (lajur-gw.*), in parallel with the
# existing cilium Ingress on lajur-dev.rifqoi.com.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lajur-kgw
  annotations:
    external-dns.alpha.kubernetes.io/hostname: lajur-gw.rifqoi.com
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
  hostnames:
    - lajur-gw.rifqoi.com
  rules:
    - backendRefs:
        - name: lajur
          port: 80

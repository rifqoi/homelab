apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lajur
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: lajur-dev.rifqoi.com
    ingress.cilium.io/force-https: "true"
spec:
  ingressClassName: cilium
  tls:
    - secretName: lajur-dev-rifqoi-com-tls
      hosts:
        - lajur-dev.rifqoi.com
  rules:
    - host: lajur-dev.rifqoi.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lajur
                port:
                  number: 80

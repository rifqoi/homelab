# Migrated from Ingress to the shared kgateway (192.168.31.139).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kelasivana-app
  namespace: kelasivana-dev
  annotations:
    external-dns.alpha.kubernetes.io/hostname: kelasivana-dev.rifqoi.com
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - kelasivana-dev.rifqoi.com
  rules:
    - backendRefs:
        - name: kelasivana
          port: 80

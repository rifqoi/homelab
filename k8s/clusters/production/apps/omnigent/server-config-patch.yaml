apiVersion: v1
kind: ConfigMap
metadata:
  name: omnigent-config
  namespace: omnigent
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  ARTIFACT_DIR: /data/artifacts
  OMNIGENT_ADMIN_CREDENTIALS_PATH: /data/admin-credentials
  OMNIGENT_AUTH_ENABLED: "1"
  OMNIGENT_AUTH_PROVIDER: accounts
  OMNIGENT_ACCOUNTS_BASE_URL: https://omnigent.rifqoi.com
  OMNIGENT_DOMAIN: omnigent.rifqoi.com

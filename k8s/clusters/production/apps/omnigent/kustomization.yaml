# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Use the upstream server base. The registered host below is deliberately
# managed as a separate persistent Deployment rather than as one Kubernetes
# Job per managed session.
resources:
  - github.com/omnigent-ai/omnigent//deploy/kubernetes/base?ref=v0.19.1
  - host-pvc.yaml
  - host-deployment.yaml

patches:
  - path: image-patch.yaml
  - path: server-config-patch.yaml
  - path: omnigent-secrets.enc.yaml
  - path: ingress.yaml

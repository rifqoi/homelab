# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keep the upstream runner RBAC and Job implementation. The remote reference is
# pinned to a release tag; the images are pinned by digest in image-patch.yaml.
resources:
  - github.com/omnigent-ai/omnigent//deploy/kubernetes/overlays/sandbox-runners?ref=v0.19.1

patches:
  - path: image-patch.yaml
  - path: sandbox-config-patch.yaml
  - path: server-config-patch.yaml
  - path: omnigent-secrets.enc.yaml
  - path: ingress.yaml

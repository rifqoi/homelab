# Gateway-wide listener defaults. Envoy's own defaults differ from the old
# Cilium Ingress in ways that break apps here, so set them explicitly.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: ListenerPolicy
metadata:
  name: shared
  namespace: kgateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared
  default:
    httpSettings:
      # Envoy answers HTTP upgrades with 403 unless enabled; Paseo's direct
      # connection and other websocket clients need this.
      upgradeConfig:
        enabledUpgrades:
          - websocket
      # Envoy's 5m default drops quiet websocket and SSE streams.
      streamIdleTimeout: 1h
      accessLog:
        - fileSink:
            path: /dev/stdout
            jsonFormat:
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              authority: "%REQ(:AUTHORITY)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              upstream_host: "%UPSTREAM_HOST%"
              duration_ms: "%DURATION%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              user_agent: "%REQ(USER-AGENT)%"

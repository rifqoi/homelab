apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway-crds
  namespace: flux-system
spec:
  targetNamespace: kgateway-system
  interval: 15m
  chart:
    spec:
      chart: kgateway-crds
      version: 2.4.7
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false

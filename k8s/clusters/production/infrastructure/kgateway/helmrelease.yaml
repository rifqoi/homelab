apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: flux-system
spec:
  targetNamespace: kgateway-system
  interval: 15m
  dependsOn:
    - name: kgateway-crds
      namespace: flux-system
  chart:
    spec:
      chart: kgateway
      version: 2.4.7
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    gatewayClassParametersRefs:
      kgateway:
        name: kgateway
        namespace: kgateway-system

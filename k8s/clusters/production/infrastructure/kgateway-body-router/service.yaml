# Dedicated LoadBalancer Service: gets its own IP from the Cilium pool, and
# the `announce` label makes manual-announce-l2 ARP-announce it. external-dns
# (service source) publishes channel.rifqoi.com -> this IP.
apiVersion: v1
kind: Service
metadata:
  name: body-router
  namespace: kgateway-system
  labels:
    announce: "true"
  annotations:
    external-dns.alpha.kubernetes.io/hostname: channel.rifqoi.com
spec:
  type: LoadBalancer
  selector:
    app: body-router
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https

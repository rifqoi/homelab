apiVersion: apps/v1
kind: Deployment
metadata:
  name: body-router
  namespace: kgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: body-router
  template:
    metadata:
      labels:
        app: body-router
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.38.1
          command: ["/usr/local/bin/envoy"]
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          readinessProbe:
            tcpSocket:
              port: https
          livenessProbe:
            tcpSocket:
              port: https
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
            - name: tls
              mountPath: /etc/envoy/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: body-router-envoy
        # Shared wildcard cert managed by cert-manager.
        - name: tls
          secret:
            secretName: kgw-wildcard-tls

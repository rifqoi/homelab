# Custom bootstrap for the managed body-router proxy (mounted via
# GatewayParameters.deploymentOverlay, replacing the generated ConfigMap).
# Owns the static :443 listener filter chain (RBAC spoof guard -> transform
# body.channel -> x-internal-channel -> route re-match -> router).
# Routes come from kgateway RDS "https" (httproute.yaml); upstreams via CDS/EDS.
# The xds_service_account_token.json key is injected by configMapGenerator
# literals in kustomization.yaml (SDS resource feeding the credential_injector).
# See ../kgateway/body-routing.md for the full design and caveats.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 19000 }
layered_runtime:
  layers:
  - name: static_layer
    static_layer:
      envoy.restart_features.use_eds_cache_for_ads: true
  - name: admin_layer
    admin_layer: {}
node:
  cluster: "body-router.kgateway-system"
  metadata:
    role: kgateway-kube-gateway-api~kgateway-system~body-router
cluster_manager:
  local_cluster_name: "body-router.kgateway-system"
static_resources:
  listeners:
  - name: readiness_listener
    address:
      socket_address: { address: 0.0.0.0, port_value: 8082 }
    filter_chains:
      - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http
            codec_type: AUTO
            route_config:
              name: main_route
              virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                    - match:
                        path: "/ready"
                      route:
                        cluster: admin_port_cluster
            http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  - name: http-redirect
    address:
      socket_address: { address: 0.0.0.0, port_value: 80 }
    filter_chains:
      - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: http_redirect
            codec_type: AUTO
            route_config:
              name: http_redirect
              virtual_hosts:
                - name: redirect
                  domains: ["*"]
                  routes:
                    - match: { prefix: "/" }
                      redirect: { https_redirect: true }
            http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  - name: body-router-https
    address:
      socket_address: { address: 0.0.0.0, port_value: 443 }
    filter_chains:
      - transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_certificates:
                - certificate_chain: {filename: /etc/envoy/tls/tls.crt}
                  private_key: {filename: /etc/envoy/tls/tls.key}
        filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: body_router
            codec_type: AUTO
            # Routes come from kgateway xDS for this Gateway's :443 listener
            # (HTTPRoute channel-route). lds_config is absent so kgateway
            # cannot also inject its own listener without our filters.
            rds:
              route_config_name: https
              config_source:
                ads: {}
                resource_api_version: V3
            http_filters:
              - name: envoy.filters.http.rbac
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                  rules:
                    action: DENY
                    policies:
                      no-spoofed-channel-header:
                        permissions:
                          - header: {name: x-internal-channel, present_match: true}
                        principals: [{any: true}]
              - name: envoy.filters.http.transform
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.transform.v3.TransformConfig
                  request_transformation:
                    headers_mutations:
                      - append:
                          header: {key: x-internal-channel, value: "%REQUEST_BODY(channel)%"}
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  clear_route_cache: true
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: "body-router.kgateway-system"
      connect_timeout: 0.250s
      type: EDS
      lb_policy: ROUND_ROBIN
      eds_cluster_config:
        eds_config:
          ads: {}
          resource_api_version: V3
          initial_fetch_timeout: 1s
    - name: xds_cluster
      alt_stat_name: xds_cluster
      connect_timeout: 5.000s
      load_assignment:
        cluster_name: xds_cluster
        endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  address: kgateway-system-kgateway.kgateway-system.svc.cluster.local.
                  port_value: 9977
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
          http_filters:
          - name: envoy.filters.http.credential_injector
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
              credential:
                name: envoy.http.injected_credentials.generic
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                  credential:
                    name: xds-jwt-token
                    sds_config:
                      path_config_source:
                        path: "/etc/envoy/xds_service_account_token.json"
                      resource_api_version: V3
                  header_value_prefix: "Bearer "
              overwrite: true
          - name: envoy.filters.http.upstream_codec
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
      upstream_connection_options:
        tcp_keepalive:
          keepalive_time: 10
      cluster_type:
        name: envoy.cluster.strict_dns
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
          respect_dns_ttl: true
    - name: admin_port_cluster
      connect_timeout: 5.000s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: admin_port_cluster
        endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address: { address: 127.0.0.1, port_value: 19000 }
typed_dns_resolver_config:
  name: envoy.network.dns_resolver.cares
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.network.dns_resolver.cares.v3.CaresDnsResolverConfig
    udp_max_queries: 100
dynamic_resources:
  ads_config:
    transport_api_version: V3
    api_type: GRPC
    rate_limit_settings: {}
    grpc_services:
    - envoy_grpc:
        cluster_name: xds_cluster
  cds_config:
    resource_api_version: V3
    initial_fetch_timeout: 0s
    ads: {}

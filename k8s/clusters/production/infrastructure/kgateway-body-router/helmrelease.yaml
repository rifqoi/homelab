apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: body-router
  namespace: kgateway-system
spec:
  interval: 1h
  chart:
    spec:
      chart: ./k8s/clusters/production/infrastructure/kgateway-body-router/chart
      # Upgrade on every source revision so values/template changes in the
      # git chart dir apply without a Chart.yaml version bump.
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1m

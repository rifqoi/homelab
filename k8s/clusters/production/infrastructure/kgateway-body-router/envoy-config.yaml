# Static Envoy for body-based routing: extracts JSON `channel` into
# x-internal-channel and re-runs route matching. Minimal bootstrap --
# one listener, three filters, two upstream clusters. See
# ../kgateway/body-routing.md for why this can't use kgateway xDS
# (server requires SA-JWT auth only envoyinit can inject).
apiVersion: v1
kind: ConfigMap
metadata:
  name: body-router-envoy
  namespace: kgateway-system
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: {address: 127.0.0.1, port_value: 19000}
    static_resources:
      listeners:
        - name: https
          address:
            socket_address: {address: 0.0.0.0, port_value: 443}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain: {filename: /etc/envoy/tls/tls.crt}
                        private_key: {filename: /etc/envoy/tls/tls.key}
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: body_router
                    codec_type: AUTO
                    route_config:
                      name: body_router
                      virtual_hosts:
                        - name: body_router
                          domains: ["channel.rifqoi.com"]
                          routes:
                            - match:
                                prefix: "/"
                                headers: [{name: x-internal-channel, string_match: {exact: web}}]
                              route: {cluster: web}
                            - match:
                                prefix: "/"
                                headers: [{name: x-internal-channel, string_match: {exact: mobile}}]
                              route: {cluster: mobile}
                            - match:
                                prefix: "/"
                              direct_response: {status: 400, body: {inline_string: "unknown or missing channel\n"}}
                    http_filters:
                      # Reject spoofed routing headers before body read.
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: DENY
                            policies:
                              no-spoofed-channel-header:
                                permissions:
                                  - header: {name: x-internal-channel, present_match: true}
                                principals: [{any: true}]
                      # body.channel -> x-internal-channel, then re-match.
                      - name: envoy.filters.http.transform
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.transform.v3.TransformConfig
                          request_transformation:
                            headers_mutations:
                              - append:
                                  header: {key: x-internal-channel, value: "%REQUEST_BODY(channel)%"}
                                  append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          clear_route_cache: true
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        # TODO: replace Service DNS names/ports with the real backends.
        - name: web
          type: LOGICAL_DNS
          connect_timeout: 2s
          load_assignment:
            cluster_name: web
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: web-svc.example.svc.cluster.local, port_value: 8080}
        - name: mobile
          type: LOGICAL_DNS
          connect_timeout: 2s
          load_assignment:
            cluster_name: mobile
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: mobile-svc.example.svc.cluster.local, port_value: 8080}

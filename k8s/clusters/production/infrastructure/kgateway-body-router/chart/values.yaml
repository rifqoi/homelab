# Hostname the body-router listeners and routes serve.
hostname: channel.rifqoi.com

# Envoy proxy image: upstream envoy-wrapper with a patched rustformation
# module (built in rifqoi/images envoywrapper/). The tag is managed by Flux
# image automation via the $imagepolicy marker — never `latest`.
image:
  registry: registry.rifqoi.com
  repository: envoywrapper
  # Initial placeholder until a real main-* tag is published and picked up.
  tag: main-1793761951-73e8bae # {"$imagepolicy": "kgateway-system:envoywrapper:tag"}

# JSON body fields extracted into internal routing headers by the
# TrafficPolicy transformation. `body` is a dotted path into the parsed
# JSON body (e.g. `user.phone`); `template` optionally overrides the whole
# generated template. Each entry becomes a transformation `set`, which
# overwrites or removes the header — the spoof guard comes free.
extractions:
  - body: channel
    header: x-internal-channel
  - body: phone_number
    header: x-internal-phone-number

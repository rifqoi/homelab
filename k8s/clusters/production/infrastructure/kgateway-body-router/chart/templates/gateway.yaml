# MANAGED gateway: kgateway creates the Deployment/Service/SA for us.
# The deploymentOverlay repoints the generated `envoy-config` volume at our
# bootstrap ConfigMap, so the proxy boots our static listener+filters but
# keeps the envoyinit-injected xDS JWT. The wildcard TLS secret is mounted
# as a file for the static listener. Gateway API v1.0 has no per-Gateway
# parametersRef, so a dedicated GatewayClass carries these GatewayParameters.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: body-router
  namespace: kgateway-system
spec:
  kube:
    deploymentOverlay:
      spec:
        template:
          spec:
            volumes:
              - name: envoy-config
                configMap:
                  name: body-router-envoy
    podTemplate:
      extraVolumes:
        - name: tls
          secret:
            secretName: kgw-wildcard-tls
    envoyContainer:
      extraVolumeMounts:
        - name: tls
          mountPath: /etc/envoy/tls
          readOnly: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: body-router
spec:
  controllerName: kgateway.dev/kgateway
  parametersRef:
    group: gateway.kgateway.dev
    kind: GatewayParameters
    namespace: kgateway-system
    name: body-router
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: body-router
  namespace: kgateway-system
spec:
  gatewayClassName: body-router
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: kgw-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All

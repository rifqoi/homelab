# MANAGED gateway: kgateway creates the Deployment/Service/SA for us.
# The envoy container runs the envoywrapper image — upstream envoy-wrapper
# with a patched rustformation dynamic module that clears the route cache
# after a request transformation, so headers set from the JSON body
# re-trigger route selection. TLS is served natively by kgateway via SDS
# from the kgw-wildcard-tls secret (no file mount, no restart on rotation).
# Gateway API v1.0 has no per-Gateway infrastructure.parametersRef, so a
# dedicated GatewayClass carries these GatewayParameters.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: body-router
  namespace: kgateway-system
spec:
  kube:
    envoyContainer:
      image:
        registry: {{ .Values.image.registry }}
        repository: {{ .Values.image.repository }}
        tag: {{ .Values.image.tag | quote }}
    podTemplate:
      imagePullSecrets:
        - name: regcred-rifqoi-registry-com
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: body-router
spec:
  controllerName: kgateway.dev/kgateway
  parametersRef:
    group: gateway.kgateway.dev
    kind: GatewayParameters
    namespace: kgateway-system
    name: body-router
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: body-router
  namespace: kgateway-system
spec:
  gatewayClassName: body-router
  listeners:
    # Plain HTTP only exists to redirect to HTTPS (see http-redirect route).
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.hostname }}
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: kgw-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All

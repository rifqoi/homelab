apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gateway.yaml
  - httproute.yaml
  - referencegrant.yaml
configMapGenerator:
  - name: body-router-envoy
    files:
      - envoy.yaml
    literals:
      # SDS resource feeding the xds_cluster credential_injector
      # (same key/content the generated bootstrap ConfigMap ships).
      - 'xds_service_account_token.json={"resources":[{"@type":"type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret","name":"xds-jwt-token","generic_secret":{"secret":{"filename":"/var/run/secrets/tokens/xds-token"}}}]}'
generatorOptions:
  # The deploymentOverlay volume references this ConfigMap by name, so no hash.
  disableNameSuffixHash: true

# Real kgateway-managed routes for the body-router. The static Envoy listener
# subscribes to these via RDS ("listener~443"): it extracts `channel` from the
# JSON body into x-internal-channel and clears the route cache, so the
# second route resolution hits one of the header-matched rules below.
# TODO: replace web-svc/mobile-svc with the real Services.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: DirectResponse
metadata:
  name: unknown-channel
  namespace: kgateway-system
spec:
  status: 400
  body: "unknown or missing channel\n"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: channel-route
  namespace: kgateway-system
spec:
  parentRefs:
    - name: body-router
      sectionName: https
  hostnames:
    - channel.rifqoi.com
  rules:
    # Body-derived headers can use any HTTPRoute header match, including
    # RegularExpression -- the APISIX-expression equivalent for matching.
    - matches:
        - headers:
            - name: x-internal-channel
              type: Exact
              value: mobile
      # PriorityGroups backend: mobile -> other when mobile is unhealthy.
      backendRefs:
        - group: gateway.kgateway.dev
          kind: Backend
          name: mobile-failover
    - matches:
        - headers:
            - name: x-internal-channel
              type: Exact
              value: web
      backendRefs:
        - name: web-svc
          namespace: example
          port: 8080
    # Provider routing on body.phone_number prefixes (approximate
    # Indonesian mobile prefixes, local 08xx format).
    - matches:
        - headers:
            - name: x-internal-phone-number
              type: RegularExpression
              value: "^08(11|12|13|21|22|23|51|52|53)"  # Telkomsel
      backendRefs:
        - name: telkomsel-svc
          namespace: example
          port: 8080
    - matches:
        - headers:
            - name: x-internal-phone-number
              type: RegularExpression
              value: "^08(17|18|19|59|77|78)"  # XL
      backendRefs:
        - name: xl-svc
          namespace: example
          port: 8080
    - matches:
        - headers:
            - name: x-internal-phone-number
              type: RegularExpression
              value: "^08(14|15|16|55|56|57|58)"  # Indosat
      backendRefs:
        - name: indosat-svc
          namespace: example
          port: 8080
    - matches:
        - headers:
            - name: x-internal-phone-number
              type: RegularExpression
              value: "^089[5-9]"  # Tri
      backendRefs:
        - name: tri-svc
          namespace: example
          port: 8080
    # Per-field fallbacks: channel value outside web/mobile -> other;
    # phone number outside known provider prefixes -> indosat.
    - matches:
        - headers:
            - name: x-internal-channel
              type: RegularExpression
              value: ".+"
      backendRefs:
        - name: other-svc
          namespace: example
          port: 8080
    - matches:
        - headers:
            - name: x-internal-phone-number
              type: RegularExpression
              value: ".+"
      backendRefs:
        - name: indosat-svc
          namespace: example
          port: 8080
    # Fallback for requests with neither extracted field (empty/non-JSON
    # body): fail closed.
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.kgateway.dev
            kind: DirectResponse
            name: unknown-channel

# yaml-language-server: $schema=https://flux-helm-schema.tplant.com.au?values=https://raw.githubusercontent.com/actions/actions-runner-controller/refs/heads/master/charts/gha-runner-scale-set/values.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-lajur
  namespace: flux-system
spec:
  targetNamespace: arc-runners
  interval: 15m
  dependsOn:
    - name: arc-controller
      namespace: flux-system
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    githubConfigUrl: https://github.com/rifqoi/lajur
    githubConfigSecret: arc-github-token
    runnerScaleSetName: lajur
    minRunners: 0
    maxRunners: 2
    # Image builds go to the in-cluster buildkitd, so no dind/privileged runner.
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            volumeMounts:
              - name: registry-auth
                mountPath: /home/runner/.docker/config.json
                subPath: .dockerconfigjson
                readOnly: true
        volumes:
          - name: registry-auth
            secret:
              secretName: regcred-rifqoi-registry-com

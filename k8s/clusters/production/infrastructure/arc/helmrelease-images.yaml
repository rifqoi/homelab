apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-images
  namespace: flux-system
spec:
  targetNamespace: arc-runners
  interval: 15m
  dependsOn:
    - name: arc-controller
      namespace: flux-system
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    githubConfigUrl: https://github.com/rifqoi/images
    githubConfigSecret: arc-github-token
    runnerScaleSetName: images
    minRunners: 0
    maxRunners: 2
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command:
              - /home/runner/run.sh
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            volumeMounts:
              - name: docker-home
                mountPath: /home/runner/.docker
        volumes:
          - name: registry-auth
            secret:
              secretName: regcred-rifqoi-registry-com
          - name: docker-home
            emptyDir: {}
        initContainers:
          - name: init-docker-config
            image: ghcr.io/actions/actions-runner:latest
            command:
              - sh
              - -c
              - cp /secret/.dockerconfigjson /dockerconfig/config.json && chmod
                644 /dockerconfig/config.json
            volumeMounts:
              - name: registry-auth
                mountPath: /secret
              - name: docker-home
                mountPath: /dockerconfig

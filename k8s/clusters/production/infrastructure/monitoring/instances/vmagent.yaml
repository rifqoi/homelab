apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: homelab
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-vmagent
spec:
  replicaCount: 1
  # Pick up every VMServiceScrape/VMPodScrape/VMProbe/VMScrapeConfig
  # in every namespace.
  selectAllByDefault: true
  remoteWrite:
    # In-cluster VMSingle is the metrics store. Atlas Grafana queries it via
    # the kgateway HTTPRoute at vmsingle.rifqoi.com.
    - url: http://vmsingle-homelab.monitoring.svc:8429/api/v1/write
  extraArgs:
    remoteWrite.label: cluster=production
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

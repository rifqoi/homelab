# Nongkee VM exporters over Tailscale (cluster can't resolve MagicDNS, use
# the tailscale IP). Atlas Prometheus scrapes these too — duplication is
# intentional so cluster Grafana has them via the VM datasource.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: nongkee-node
  namespace: monitoring
spec:
  job_name: nongkee-node-exporter
  scrape_interval: 30s
  static_configs:
    - targets:
        - 100.121.58.61:9100
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: nongkee-postgres
  namespace: monitoring
spec:
  job_name: nongkee-postgres
  scrape_interval: 30s
  static_configs:
    - targets:
        - 100.121.58.61:9187
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: nongkee-app
  namespace: monitoring
spec:
  job_name: nongkee
  scrape_interval: 30s
  static_configs:
    - targets:
        - 100.121.58.61:8081

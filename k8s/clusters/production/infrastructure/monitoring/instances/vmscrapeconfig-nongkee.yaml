# Nongkee VM exporters over Tailscale (cluster can't resolve MagicDNS, use
# the tailscale IP). Atlas Prometheus scrapes these too — duplication is
# intentional so cluster Grafana has them via the VM datasource.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: nongkee-node
  namespace: monitoring
spec:
  jobName: nongkee-node-exporter
  targetEndpoints:
    - targets:
        - 100.121.58.61:9100
      interval: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: nongkee-postgres
  namespace: monitoring
spec:
  jobName: nongkee-postgres
  targetEndpoints:
    - targets:
        - 100.121.58.61:9187
      interval: 30s
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: nongkee-app
  namespace: monitoring
spec:
  jobName: nongkee
  targetEndpoints:
    - targets:
        - 100.121.58.61:8081
      interval: 30s

# Nongkee VM exporters over Tailscale (cluster can't resolve MagicDNS, use
# the tailscale IP). Atlas Prometheus scrapes these too — duplication is
# intentional so cluster Grafana has them via the VM datasource.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: nongkee-node
  namespace: monitoring
spec:
  jobName: nongkee-node-exporter
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - 100.121.58.61:9100
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: nongkee-postgres
  namespace: monitoring
spec:
  jobName: nongkee-postgres
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - 100.121.58.61:9187
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMScrapeConfig
metadata:
  name: nongkee-app
  namespace: monitoring
spec:
  jobName: nongkee
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - 100.121.58.61:8081

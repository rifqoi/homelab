# Dashboards pulled from grafana.com by ID; the datasource input is wired to
# the matching operator-managed datasource.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: k8s-views-global
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: atlas
  folderRef: cluster
  grafanaCom:
    id: 15757
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Cluster VictoriaMetrics
    - inputName: Prometheus
      datasourceName: Cluster VictoriaMetrics
    - inputName: datasource
      datasourceName: Cluster VictoriaMetrics
---

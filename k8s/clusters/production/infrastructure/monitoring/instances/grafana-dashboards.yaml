# Dashboards pulled from grafana.com by ID; the datasource input is wired to
# the matching operator-managed datasource.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-ksm
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: atlas
  folder: cluster
  gnetId: 13335
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: Cluster VictoriaMetrics
---

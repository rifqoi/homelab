# Alerts -> n8n webhook -> Telegram. The n8n workflow "Grafana Alerts to
# Telegram" (id grafanaAlertsTG01) receives Grafana webhook posts at the URL
# below and forwards them via the Telegram account credential (chat 1610326964).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: telegram-n8n
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: atlas
  name: telegram-n8n
  type: webhook
  settings:
    url: https://n8n.rifqoi.com/webhook/grafanaAlertsTG01/webhook/grafana-alerts
    httpMethod: POST
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: root-to-telegram
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: atlas
  route:
    receiver: telegram-n8n
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaAlertRuleGroup
metadata:
  name: cluster-health
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: atlas
  folderRef: cluster
  interval: 1m
  rules:
    - uid: vm-target-down
      title: Scrape target down
      condition: B
      for: 5m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "Target {{ $labels.job }} ({{ $labels.instance }}) is down"
      labels:
        severity: warning
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: up
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A < 1
    - uid: pod-crashlooping
      title: Pod crash looping
      condition: B
      for: 15m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarting repeatedly"
      labels:
        severity: critical
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            expr: increase(kube_pod_container_status_restarts_total[15m])
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A > 3
    - uid: deployment-replicas-mismatch
      title: Deployment replicas unavailable
      condition: B
      for: 15m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
      labels:
        severity: warning
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            expr: kube_deployment_spec_replicas - kube_deployment_status_replicas_available
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A > 0
    - uid: atlas-node-exporter-down
      title: Node exporter down (Atlas scrape set)
      condition: B
      for: 5m
      noDataState: Alerting
      execErrState: Error
      annotations:
        summary: "a node-exporter target on Atlas Prometheus is unreachable"
      labels:
        severity: critical
      data:
        - refId: A
          datasourceUid: atlas-prometheus
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: up{job="node-exporter",instance!="nongkee.home.local:9100"}
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A < 1
    - uid: atlas-disk-full
      title: Disk almost full (Atlas scrape set)
      condition: B
      for: 15m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "filesystem >85% full"
      labels:
        severity: warning
      data:
        - refId: A
          datasourceUid: atlas-prometheus
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            expr: 1 - (node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay"})
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A > 0.85
    - uid: atlas-mem-pressure
      title: Memory pressure (Atlas scrape set)
      condition: B
      for: 15m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "RAM usage >90%"
      labels:
        severity: warning
      data:
        - refId: A
          datasourceUid: atlas-prometheus
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            expr: 1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A > 0.9
    - uid: nongkee-node-down
      title: Node exporter down (nongkee)
      condition: B
      for: 5m
      noDataState: Alerting
      execErrState: Error
      annotations:
        summary: "node_exporter on nongkee VM is unreachable"
      labels:
        severity: critical
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: up{job="nongkee-node-exporter"}
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A < 1
    - uid: nongkee-node-disk-full
      title: Nongkee disk almost full
      condition: B
      for: 15m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "nongkee filesystem >85% full"
      labels:
        severity: warning
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            expr: 1 - (node_filesystem_avail_bytes{job="nongkee-node-exporter",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="nongkee-node-exporter",fstype!~"tmpfs|overlay"})
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A > 0.85
    - uid: nongkee-node-mem-pressure
      title: Nongkee memory pressure
      condition: B
      for: 15m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "nongkee RAM usage >90%"
      labels:
        severity: warning
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            expr: 1 - (node_memory_MemAvailable_bytes{job="nongkee-node-exporter"} / node_memory_MemTotal_bytes{job="nongkee-node-exporter"})
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A > 0.9
    - uid: nongkee-postgres-down
      title: Postgres exporter down (nongkee)
      condition: B
      for: 5m
      noDataState: Alerting
      execErrState: Error
      annotations:
        summary: "postgres_exporter on nongkee is unreachable"
      labels:
        severity: critical
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: pg_up{job="nongkee-postgres"}
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A < 1
    - uid: nongkee-postgres-connections
      title: Postgres high connection usage (nongkee)
      condition: B
      for: 15m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "nongkee postgres using >80% of max connections"
      labels:
        severity: warning
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 900
            to: 0
          model:
            refId: A
            expr: sum(pg_stat_activity_count{job="nongkee-postgres", datname!~"template.*"}) / max(pg_settings_max_connections{job="nongkee-postgres"})
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A > 0.8
    - uid: node-not-ready
      title: Node not ready
      condition: B
      for: 5m
      noDataState: NoData
      execErrState: Error
      annotations:
        summary: "Node {{ $labels.node }} not Ready"
      labels:
        severity: critical
      data:
        - refId: A
          datasourceUid: vmsingle-cluster
          relativeTimeRange:
            from: 600
            to: 0
          model:
            refId: A
            expr: kube_node_status_condition{condition="Ready", status="true"}
            instant: true
            range: false
        - refId: B
          datasourceUid: __expr__
          model:
            refId: B
            type: math
            expression: $A < 1

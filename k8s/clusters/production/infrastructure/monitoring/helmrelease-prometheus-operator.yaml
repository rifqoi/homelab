apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.10.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Atlas remains the Prometheus/Grafana server. Install only the
    # Prometheus Operator controller and monitoring.coreos.com CRDs here.
    alertmanager:
      enabled: false
    defaultRules:
      create: false
    grafana:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeStateMetrics:
      enabled: false
    kubernetesServiceMonitors:
      enabled: false
    nodeExporter:
      enabled: false
    prometheus:
      enabled: false
    prometheusOperator:
      enabled: true
      admissionWebhooks:
        enabled: false
      tls:
        enabled: false
      serviceMonitor:
        enabled: false

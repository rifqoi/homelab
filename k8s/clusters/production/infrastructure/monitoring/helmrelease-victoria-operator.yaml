apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 15m
  chart:
    spec:
      chart: victoria-metrics-operator
      version: 0.68.1
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Watches operator.victoriametrics.com CRDs (VMServiceScrape, VMPodScrape,
    # VMProbe, VMRule, VMScrapeConfig).
    serviceMonitor:
      enabled: false

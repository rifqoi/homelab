apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 15m
  chart:
    spec:
      chart: grafana-operator
      version: 5.25.0
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Manage the external Grafana instance through Grafana resources later.
    crds:
      immutable: false
    serviceMonitor:
      enabled: false

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: homelab
  namespace: monitoring
spec:
  retentionPeriod: "3"
  storage:
    storageClassName: zfs-iscsi-retain
    resources:
      requests:
        storage: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
---
# Expose VMSingle on the LAN so the external Grafana on Atlas can query it.
# Cilium L2 announces it (service needs label announce: "true").
apiVersion: v1
kind: Service
metadata:
  name: vmsingle-homelab-lb
  namespace: monitoring
  labels:
    announce: "true"
  annotations:
    io.cilium/lb-ipam-ips: "192.168.31.160"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: vmsingle
    app.kubernetes.io/instance: homelab
  ports:
    - name: http
      port: 8429
      targetPort: 8429

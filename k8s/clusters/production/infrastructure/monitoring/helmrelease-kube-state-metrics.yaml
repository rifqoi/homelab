apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: flux-system
spec:
  targetNamespace: monitoring
  interval: 15m
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.7.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # monitoring.coreos.com ServiceMonitor CRDs are not installed;
    # vmagent scrapes it via VMServiceScrape instead.
    prometheus:
      monitor:
        enabled: false

apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: homelab
  namespace: monitoring
  labels:
    app.kubernetes.io/name: homelab-prometheus
spec:
  replicas: 1
  retention: 7d
  enableAdminAPI: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceMonitorSelector: {}
  serviceMonitorNamespaceSelector: {}
  podMonitorSelector: {}
  podMonitorNamespaceSelector: {}
  scrapeConfigSelector:
    matchLabels:
      prometheus: homelab
  scrapeConfigNamespaceSelector: {}

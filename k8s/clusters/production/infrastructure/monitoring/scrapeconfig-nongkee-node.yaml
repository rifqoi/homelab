apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: nongkee-node-exporter
  namespace: monitoring
  labels:
    prometheus: homelab
spec:
  jobName: nongkee-node-exporter
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        # The cluster cannot resolve the Tailscale MagicDNS zone, so use the
        # stable Tailscale address while retaining the Nix target semantics.
        - 100.121.58.61:9100

# Exposes VMSingle on the shared kgateway so the external Grafana on Atlas
# can query it at https://vmsingle.rifqoi.com.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmsingle
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/hostname: vmsingle.rifqoi.com
spec:
  parentRefs:
    - name: shared
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - vmsingle.rifqoi.com
  rules:
    - backendRefs:
        - name: vmsingle-homelab
          port: 8429
